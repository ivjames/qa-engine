<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Run history{% endblock %} · QA Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0e14'/%3E%3Ccircle cx='42' cy='42' r='24' fill='none' stroke='%2322d3ee' stroke-width='9'/%3E%3Cline x1='60' y1='60' x2='82' y2='82' stroke='%2322d3ee' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --bg-1:#0d1219;
    --panel:#111722;
    --panel-2:#161d29;
    --panel-3:#1b2330;
    --border:#232c3a;
    --border-soft:#1b2330;
    --text:#e6edf3;
    --text-dim:#93a1b3;
    --text-faint:#5b6577;
    --accent:#22d3ee;
    --accent-dim:rgba(34,211,238,.14);
    --accent-strong:#67e8f9;
    --good:#34d399;
    --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;

    --sev-critical:#ff4d6d;
    --sev-critical-bg:rgba(255,77,109,.12);
    --sev-serious:#f4511e;
    --sev-serious-bg:rgba(244,81,30,.13);
    --sev-moderate:#f5b300;
    --sev-moderate-bg:rgba(245,179,0,.13);
    --sev-minor:#94a3b8;
    --sev-minor-bg:rgba(148,163,184,.12);
    --sev-info:#38bdf8;
    --sev-info-bg:rgba(56,189,248,.12);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(34,211,238,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(124,108,246,.05), transparent 55%),
      var(--bg);
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;color:var(--text);}
  code,pre,.mono{font-family:var(--font-mono);}
  a{color:var(--accent-strong);}
  ::selection{background:var(--accent-dim);color:var(--accent-strong);}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(10,14,20,.82);
    backdrop-filter:blur(10px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:980px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;
    color:var(--text);text-decoration:none;
  }
  .brand-mark{
    width:26px;height:26px;border-radius:7px;
    background:linear-gradient(155deg,var(--accent),#7c6cf6);
    display:inline-flex;align-items:center;justify-content:center;
    color:#04121a;font-size:14px;font-weight:700;
  }
  .topbar-nav{margin-left:auto;display:flex;gap:14px;}
  .topbar-nav a{
    font-size:12.5px;font-weight:600;color:var(--text-dim);text-decoration:none;
    padding:5px 10px;border-radius:7px;transition:color .15s,background .15s;
  }
  .topbar-nav a:hover{color:var(--text);}
  .topbar-nav a.active{color:var(--accent-strong);background:var(--accent-dim);}

  .page{max-width:980px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px;}

  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:16px;
  }
  .panel h3{
    font-size:11px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--text-faint);font-weight:600;margin-bottom:12px;
  }

  .banner{
    border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.45;
    border:1px solid;display:flex;gap:8px;align-items:flex-start;
  }
  .banner.fatal{background:var(--sev-critical-bg);border-color:var(--sev-critical);color:#ffd7dd;}
  .banner.ok{background:rgba(52,211,153,.1);border-color:var(--good);color:#c9f5e3;}
  .banner .b-icon{flex:0 0 auto;font-weight:700;}

  .sev-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel-2);font-size:11px;font-weight:600;color:var(--text-dim);
    white-space:nowrap;
  }
  .sev-pill .n{font-family:var(--font-mono);}
  .sev-pill[data-sev="critical"]{border-color:var(--sev-critical);background:var(--sev-critical-bg);color:var(--sev-critical);}
  .sev-pill[data-sev="serious"]{border-color:var(--sev-serious);background:var(--sev-serious-bg);color:var(--sev-serious);}
  .sev-pill[data-sev="moderate"]{border-color:var(--sev-moderate);background:var(--sev-moderate-bg);color:var(--sev-moderate);}
  .sev-pill[data-sev="minor"]{border-color:var(--sev-minor);background:var(--sev-minor-bg);color:var(--sev-minor);}
  .sev-pill[data-sev="info"]{border-color:var(--sev-info);background:var(--sev-info-bg);color:var(--sev-info);}
  .sev-none{font-size:11.5px;color:var(--text-faint);font-style:italic;}

  .f-badge{
    font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    padding:2.5px 7px;border-radius:5px;font-family:var(--font-mono);
    border:1px solid var(--border);color:var(--text-dim);background:var(--panel-3);
  }
  .f-badge.sev{border:none;color:#04121a;}
  .f-badge.sev[data-sev="critical"]{background:var(--sev-critical);}
  .f-badge.sev[data-sev="serious"]{background:var(--sev-serious);}
  .f-badge.sev[data-sev="moderate"]{background:var(--sev-moderate);}
  .f-badge.sev[data-sev="minor"]{background:var(--sev-minor);color:#0b1017;}
  .f-badge.sev[data-sev="info"]{background:var(--sev-info);color:#04121a;}
  .f-badge.pipe{display:flex;align-items:center;gap:5px;text-transform:none;font-weight:500;}
  .f-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .f-badge.pipe[data-pipe="wcag"] .f-dot{background:#a78bfa;}
  .f-badge.pipe[data-pipe="security"] .f-dot{background:var(--accent);}
  .f-badge.pipe[data-pipe="ux"] .f-dot{background:#f472b6;}
  .f-badge.pipe[data-pipe="code"] .f-dot{background:#34d399;}

  .meta-line{
    font-size:12px;color:var(--text-dim);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .meta-line .rm-kind{
    font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.6px;
    color:var(--accent-strong);font-size:11px;font-weight:600;
    background:var(--accent-dim);padding:2px 7px;border-radius:5px;
  }
  .meta-line .rm-id{font-family:var(--font-mono);color:var(--text-faint);font-size:11px;}
  .meta-line .sep{color:var(--text-faint);}

  .btn{
    padding:6px 12px;border-radius:7px;cursor:pointer;
    border:1px solid var(--border);background:var(--panel-2);
    color:var(--text-dim);font-size:11.5px;font-weight:600;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    transition:color .15s,border-color .15s;
  }
  .btn:hover{color:var(--accent-strong);border-color:var(--accent);}
  .btn.danger:hover{color:var(--sev-critical);border-color:var(--sev-critical);}

  .empty-hint{color:var(--text-faint);font-size:12.5px;font-style:italic;line-height:1.5;}

  @media (max-width:560px){
    .topbar-inner{padding:10px 14px;}
    .page{padding:14px;}
  }
  {% block styles %}{% endblock %}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">◆</span>QA Engine</a>
    <nav class="topbar-nav">
      <a href="/">Live run</a>
      <a href="/runs" class="active">History</a>
    </nav>
  </div>
</header>
<div class="page">
{% block main %}{% endblock %}
</div>
</body>
</html>
